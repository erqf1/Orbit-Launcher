appId: com.orbit.launcher
productName: Orbit Launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# electron-builder can also infer this from package.json's "repository"
# field, but it's spelled out here so the GitHub Actions release workflow's
# --publish always-if-tag has an unambiguous target regardless of that
# field's exact URL shape.
publish:
  provider: github
  owner: erqf1
  repo: Orbit-Launcher
  releaseType: release
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: pacman
      arch: [x64]
  category: Game
  maintainer: orbit-launcher
deb:
  depends:
    - default-jre | java21-runtime | java17-runtime
pacman:
  depends:
    - jre-openjdk
