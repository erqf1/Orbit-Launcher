appId: com.erqf.launcher
productName: Erqf Launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Game
  maintainer: erqf-launcher
deb:
  depends:
    - default-jre | java21-runtime | java17-runtime
